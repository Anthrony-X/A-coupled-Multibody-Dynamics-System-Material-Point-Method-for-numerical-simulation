<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 1120 620">
  <defs>
    <style>
      .title { font: 700 18px Arial, sans-serif; fill: #202020; }
      .panel { font: 700 19px Arial, sans-serif; fill: #202020; }
      .label { font: 14px Arial, sans-serif; fill: #202020; }
      .small { font: 12px Arial, sans-serif; fill: #303030; }
      .tiny { font: 11px Arial, sans-serif; fill: #4f4f4f; }
      .bold { font-weight: 700; }
      .grid { fill: none; stroke: #8a9aa3; stroke-width: 1.2; stroke-dasharray: 6 5; stroke-linejoin: round; }
      .leader { fill: none; stroke: #555; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .dimension { fill: none; stroke: #555; stroke-width: 1.1; stroke-linecap: round; }
      .soil-top { fill: #bfe3f2; fill-opacity: .68; stroke: #0077bb; stroke-width: 1.4; stroke-linejoin: round; }
      .soil-front { fill: #8bc9e3; fill-opacity: .55; stroke: #457487; stroke-width: 1.25; stroke-linejoin: round; }
      .soil-side { fill: #75b8d5; fill-opacity: .48; stroke: #457487; stroke-width: 1.25; stroke-linejoin: round; }
      .soil-shadow { fill: #d7eaf2; fill-opacity: .48; stroke: #457487; stroke-width: 1.1; }
      .module-side { fill: #6f7f87; stroke: #333; stroke-width: 1.1; }
      .module-top { fill: #ececec; stroke: #333; stroke-width: 1.25; }
      .module-contact-side { fill: #a94b1d; stroke: #8d3f19; stroke-width: 1.1; }
      .module-contact { fill: #ee7733; stroke: #8d3f19; stroke-width: 1.25; }
      .module-head-side { fill: #456b7d; stroke: #234b5d; stroke-width: 1.1; }
      .module-head { fill: #88ccee; stroke: #234b5d; stroke-width: 1.25; }
      .joint-yaw { fill: #0077bb; stroke: #222; stroke-width: 1; }
      .joint-pitch { fill: #cc79a7; stroke: #222; stroke-width: 1; }
      .contact-patch { fill: #f5c6a5; fill-opacity: .76; stroke: #8d3f19; stroke-width: 1; stroke-dasharray: 3 2; }
      .motion { fill: none; stroke: #0077bb; stroke-width: 3; stroke-linecap: round; }
      .recycle { fill: none; stroke: #0077bb; stroke-width: 2.5; stroke-linecap: round; }
      .gravity { fill: none; stroke: #222; stroke-width: 2.2; stroke-linecap: round; }
      .box { fill: #fff; fill-opacity: .94; stroke: #777; stroke-width: .9; }
      .axis-x { stroke: #333; stroke-width: 2; }
      .axis-y { stroke: #cc79a7; stroke-width: 2; }
      .axis-z { stroke: #0077bb; stroke-width: 2; }
      .fixed { fill: url(#fixedHatch); stroke: #555; stroke-width: 1.2; }
      .leading { fill: #d9f2f8; fill-opacity: .9; stroke: #0077bb; stroke-width: 1; }
      .trailing { fill: #f5c6a5; fill-opacity: .78; stroke: #8d3f19; stroke-width: 1; }
      .particle-new { fill: #0077bb; fill-opacity: .78; }
      .particle-old { fill: #8d3f19; fill-opacity: .68; }
    </style>
    <pattern id="fixedHatch" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#efefef"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#777" stroke-width="2"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0077bb"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <g id="moduleLifted">
      <rect class="module-side" x="-13" y="-5" width="26" height="11" rx="5.5" transform="translate(2 3)"/>
      <rect class="module-top" x="-13" y="-5" width="26" height="11" rx="5.5"/>
      <path d="M-8,-2.2 L8,-2.2" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
    </g>
    <g id="moduleContact">
      <rect class="module-contact-side" x="-13" y="-5" width="26" height="11" rx="5.5" transform="translate(2 3)"/>
      <rect class="module-contact" x="-13" y="-5" width="26" height="11" rx="5.5"/>
      <path d="M-8,-2.2 L8,-2.2" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
    </g>
    <g id="moduleHead">
      <rect class="module-head-side" x="-14" y="-6" width="28" height="13" rx="6.5" transform="translate(2 3)"/>
      <rect class="module-head" x="-14" y="-6" width="28" height="13" rx="6.5"/>
      <circle cx="-8" cy="0" r="1.8" fill="#234b5d"/>
      <path d="M-3,-2.7 L8,-2.7" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
    </g>
  </defs>

  <rect width="1120" height="620" fill="#fff"/>

  <!-- Panel a -->
  <text class="panel" x="16" y="28">(a)</text>
  <text class="title" x="54" y="28">Three-dimensional MBD–MPM snake model</text>

  <rect class="box" x="28" y="48" width="276" height="45" rx="2"/>
  <text class="label" x="42" y="68"><tspan class="bold">CMU modular snake:</tspan> 17 rigid modules</text>
  <text class="small" x="42" y="85">16 alternating yaw/pitch joints; m = 3.15 kg</text>

  <!-- Background grid domain -->
  <path class="grid" d="M187,162 L683,262 L503,392 L7,292 Z M187,288 L683,388 L503,518 L7,418 Z M187,162 L187,288 M683,262 L683,388 M503,392 L503,518 M7,292 L7,418"/>

  <!-- MPM sand bed -->
  <polygon class="soil-front" points="30,353 494,446 494,500 30,407"/>
  <polygon class="soil-side" points="660,327 494,446 494,500 660,381"/>
  <polygon class="soil-shadow" points="196,234 660,327 494,446 30,353"/>
  <polygon class="soil-top" points="196,234 660,327 494,446 30,353"/>

  <!-- Supporting footprints -->
  <ellipse class="contact-patch" cx="251" cy="322" rx="35" ry="9" transform="rotate(8 251 322)"/>
  <ellipse class="contact-patch" cx="439" cy="359" rx="35" ry="9" transform="rotate(8 439 359)"/>

  <!-- Snake centerline -->
  <path d="M157,271 C183,288 198,305 221,307 C250,312 281,306 308,302 C328,299 337,303 345,309 C365,324 386,342 409,344 C438,349 470,343 496,339 C514,337 525,342 533,346" fill="none" stroke="#45545c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sixteen alternating joints -->
  <circle class="joint-yaw" cx="165.3" cy="277.2" r="4.2"/><circle class="joint-pitch" cx="183.8" cy="290.3" r="4.2"/>
  <circle class="joint-yaw" cx="207.3" cy="301.9" r="4.2"/><circle class="joint-pitch" cx="235.8" cy="307.9" r="4.2"/>
  <circle class="joint-yaw" cx="266.3" cy="307.5" r="4.2"/><circle class="joint-pitch" cx="294.7" cy="303.8" r="4.2"/>
  <circle class="joint-yaw" cx="318.2" cy="301.6" r="4.2"/><circle class="joint-pitch" cx="336.8" cy="305.1" r="4.2"/>
  <circle class="joint-yaw" cx="353.3" cy="314.8" r="4.2"/><circle class="joint-pitch" cx="371.8" cy="327.9" r="4.2"/>
  <circle class="joint-yaw" cx="395.3" cy="339.5" r="4.2"/><circle class="joint-pitch" cx="423.8" cy="345.5" r="4.2"/>
  <circle class="joint-yaw" cx="454.3" cy="345.1" r="4.2"/><circle class="joint-pitch" cx="482.7" cy="341.4" r="4.2"/>
  <circle class="joint-yaw" cx="506.2" cy="339.2" r="4.2"/><circle class="joint-pitch" cx="524.8" cy="342.7" r="4.2"/>

  <!-- Seventeen modules -->
  <use xlink:href="#moduleHead" transform="translate(157 271) rotate(33.4)"/>
  <use xlink:href="#moduleLifted" transform="translate(173.5 283.5) rotate(37.9)"/>
  <use xlink:href="#moduleLifted" transform="translate(194.1 297.1) rotate(27.5)"/>
  <use xlink:href="#moduleContact" transform="translate(220.5 306.6) rotate(11.8)"/>
  <use xlink:href="#moduleContact" transform="translate(251 309.1) rotate(-1.8)"/>
  <use xlink:href="#moduleContact" transform="translate(281.5 305.9) rotate(-9.1)"/>
  <use xlink:href="#moduleLifted" transform="translate(307.9 301.6) rotate(-7)"/>
  <use xlink:href="#moduleLifted" transform="translate(328.5 301.6) rotate(10.6)"/>
  <use xlink:href="#moduleLifted" transform="translate(345 308.5) rotate(33.4)"/>
  <use xlink:href="#moduleLifted" transform="translate(361.5 321.1) rotate(37.9)"/>
  <use xlink:href="#moduleLifted" transform="translate(382.1 334.7) rotate(27.5)"/>
  <use xlink:href="#moduleContact" transform="translate(408.5 344.2) rotate(11.8)"/>
  <use xlink:href="#moduleContact" transform="translate(439 346.7) rotate(-1.8)"/>
  <use xlink:href="#moduleContact" transform="translate(469.5 343.5) rotate(-9.1)"/>
  <use xlink:href="#moduleLifted" transform="translate(495.9 339.2) rotate(-7)"/>
  <use xlink:href="#moduleLifted" transform="translate(516.5 339.2) rotate(10.6)"/>
  <use xlink:href="#moduleLifted" transform="translate(533 346.1) rotate(33.4)"/>

  <!-- Model annotations -->
  <polyline class="leader" points="157,271 121,235 82,235"/>
  <text class="label" x="38" y="230">Head</text>

  <polyline class="leader" points="336.8,305.1 390,215 468,215"/>
  <text class="label" x="472" y="211">Alternating revolute joints</text>
  <text class="small" x="472" y="228"><tspan fill="#0077bb">yaw</tspan><tspan> / </tspan><tspan fill="#cc79a7">pitch</tspan></text>

  <polyline class="leader" points="251,322 184,468 110,468"/>
  <text class="label" x="39" y="464">Load-bearing</text>
  <text class="small" x="39" y="481">contact bands</text>

  <line class="motion" x1="548" y1="322" x2="628" y2="262" marker-end="url(#arrowBlue)"/>
  <text class="label bold" x="548" y="246" fill="#0077bb">v<tspan baseline-shift="sub" font-size="10">COM</tspan>  (−y)</text>

  <line class="gravity" x1="646" y1="171" x2="646" y2="231" marker-end="url(#arrowDark)"/>
  <text class="label bold" x="655" y="205">g</text>

  <line class="dimension" x1="145" y1="260" x2="542" y2="339" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <rect x="304" y="249" width="92" height="20" fill="#fff" fill-opacity=".88"/>
  <text class="small" x="316" y="263">L = 0.94 m</text>

  <polyline class="leader" points="74,340 100,325 132,325"/>
  <text class="label" x="40" y="322">MPM sand</text>

  <polyline class="leader" points="127,183 88,151 38,151"/>
  <text class="label" x="38" y="145">Background grid domain</text>

  <!-- Coordinate axes -->
  <g transform="translate(88 535)">
    <line class="axis-x" x1="0" y1="0" x2="66" y2="13" marker-end="url(#arrowDark)"/>
    <line class="axis-y" x1="0" y1="0" x2="-38" y2="29" marker-end="url(#arrowGray)"/>
    <line class="axis-z" x1="0" y1="0" x2="0" y2="-58" marker-end="url(#arrowBlue)"/>
    <text class="small bold" x="72" y="18">x</text>
    <text class="small bold" x="-49" y="39" fill="#cc79a7">y</text>
    <text class="small bold" x="8" y="-55" fill="#0077bb">z</text>
  </g>

  <!-- Legend -->
  <g transform="translate(190 536)">
    <rect class="module-contact" x="0" y="0" width="24" height="11" rx="5.5"/>
    <text class="small" x="31" y="10">contact-supporting module</text>
    <rect class="module-top" x="205" y="0" width="24" height="11" rx="5.5"/>
    <text class="small" x="236" y="10">lifted module</text>
  </g>
  <text class="tiny" x="30" y="588">Snake diameter: 0.050 m; continuous horizontal/vertical body waves are fitted to the discrete joint chain.</text>

  <!-- Panel separator -->
  <line x1="700" y1="12" x2="700" y2="604" stroke="#c8c8c8" stroke-width="1"/>

  <!-- Panel b: two-dimensional y-z section -->
  <text class="panel" x="718" y="28">(b)</text>
  <text class="title" x="756" y="28">2D y–z section and particle recycling</text>

  <!-- Background grid domain and grid lines -->
  <rect class="grid" x="730" y="120" width="360" height="350"/>
  <g class="grid" opacity=".32">
    <line x1="766" y1="120" x2="766" y2="470"/><line x1="802" y1="120" x2="802" y2="470"/>
    <line x1="838" y1="120" x2="838" y2="470"/><line x1="874" y1="120" x2="874" y2="470"/>
    <line x1="910" y1="120" x2="910" y2="470"/><line x1="946" y1="120" x2="946" y2="470"/>
    <line x1="982" y1="120" x2="982" y2="470"/><line x1="1018" y1="120" x2="1018" y2="470"/>
    <line x1="1054" y1="120" x2="1054" y2="470"/>
    <line x1="730" y1="170" x2="1090" y2="170"/><line x1="730" y1="220" x2="1090" y2="220"/>
    <line x1="730" y1="270" x2="1090" y2="270"/><line x1="730" y1="320" x2="1090" y2="320"/>
    <line x1="730" y1="370" x2="1090" y2="370"/><line x1="730" y1="420" x2="1090" y2="420"/>
  </g>

  <!-- Two-dimensional soil section -->
  <rect class="soil-top" x="744" y="280" width="332" height="120"/>
  <rect class="leading" x="744" y="280" width="24" height="120"/>
  <rect class="trailing" x="1052" y="280" width="24" height="120"/>
  <rect class="fixed" x="744" y="400" width="332" height="18"/>

  <!-- Particle rows -->
  <g fill="#457487" fill-opacity=".58">
    <circle cx="786" cy="300" r="2.4"/><circle cx="810" cy="300" r="2.4"/><circle cx="834" cy="300" r="2.4"/><circle cx="858" cy="300" r="2.4"/><circle cx="882" cy="300" r="2.4"/><circle cx="906" cy="300" r="2.4"/><circle cx="930" cy="300" r="2.4"/><circle cx="954" cy="300" r="2.4"/><circle cx="978" cy="300" r="2.4"/><circle cx="1002" cy="300" r="2.4"/><circle cx="1026" cy="300" r="2.4"/>
    <circle cx="786" cy="328" r="2.4"/><circle cx="810" cy="328" r="2.4"/><circle cx="834" cy="328" r="2.4"/><circle cx="858" cy="328" r="2.4"/><circle cx="882" cy="328" r="2.4"/><circle cx="906" cy="328" r="2.4"/><circle cx="930" cy="328" r="2.4"/><circle cx="954" cy="328" r="2.4"/><circle cx="978" cy="328" r="2.4"/><circle cx="1002" cy="328" r="2.4"/><circle cx="1026" cy="328" r="2.4"/>
    <circle cx="786" cy="356" r="2.4"/><circle cx="810" cy="356" r="2.4"/><circle cx="834" cy="356" r="2.4"/><circle cx="858" cy="356" r="2.4"/><circle cx="882" cy="356" r="2.4"/><circle cx="906" cy="356" r="2.4"/><circle cx="930" cy="356" r="2.4"/><circle cx="954" cy="356" r="2.4"/><circle cx="978" cy="356" r="2.4"/><circle cx="1002" cy="356" r="2.4"/><circle cx="1026" cy="356" r="2.4"/>
    <circle cx="786" cy="384" r="2.4"/><circle cx="810" cy="384" r="2.4"/><circle cx="834" cy="384" r="2.4"/><circle cx="858" cy="384" r="2.4"/><circle cx="882" cy="384" r="2.4"/><circle cx="906" cy="384" r="2.4"/><circle cx="930" cy="384" r="2.4"/><circle cx="954" cy="384" r="2.4"/><circle cx="978" cy="384" r="2.4"/><circle cx="1002" cy="384" r="2.4"/><circle cx="1026" cy="384" r="2.4"/>
  </g>
  <g class="particle-new">
    <circle cx="754" cy="300" r="2.7"/><circle cx="762" cy="328" r="2.7"/><circle cx="754" cy="356" r="2.7"/><circle cx="762" cy="384" r="2.7"/>
  </g>
  <g class="particle-old">
    <circle cx="1058" cy="300" r="2.7"/><circle cx="1068" cy="328" r="2.7"/><circle cx="1058" cy="356" r="2.7"/><circle cx="1068" cy="384" r="2.7"/>
  </g>

  <!-- Free surface and recycling path -->
  <line x1="744" y1="280" x2="1076" y2="280" stroke="#0077bb" stroke-width="1.8"/>
  <text class="small" x="970" y="270">Free surface: z = 0</text>

  <path class="recycle" d="M1064,264 C1004,167 820,167 756,264" marker-end="url(#arrowBlue)"/>
  <rect class="box" x="800" y="92" width="220" height="43" rx="2"/>
  <text class="label bold" x="814" y="111">GPU particle-layer recycling</text>
  <text class="small" x="824" y="127">trailing +y slots → leading −y soil</text>

  <line class="motion" x1="1008" y1="205" x2="882" y2="205" marker-end="url(#arrowBlue)"/>
  <text class="small bold" x="896" y="194" fill="#0077bb">window follows −y</text>

  <!-- y-normal roller boundaries -->
  <path d="M742,302 l-13,8 l13,8 Z" fill="#cc79a7"/><path d="M742,338 l-13,8 l13,8 Z" fill="#cc79a7"/>
  <path d="M1078,302 l13,8 l-13,8 Z" fill="#cc79a7"/><path d="M1078,338 l13,8 l-13,8 Z" fill="#cc79a7"/>
  <text class="tiny" x="758" y="438">Side rollers: v<tspan baseline-shift="sub" font-size="8">y</tspan> = 0</text>
  <text class="tiny" x="916" y="438">Out-of-plane rollers: v<tspan baseline-shift="sub" font-size="8">x</tspan> = 0</text>

  <!-- Fixed-bottom annotation -->
  <polyline class="leader" points="980,409 1023,455 1088,455"/>
  <text class="small" x="1000" y="472">Fixed bottom</text>
  <text class="tiny" x="982" y="488">v<tspan baseline-shift="sub" font-size="8">x</tspan> = v<tspan baseline-shift="sub" font-size="8">y</tspan> = v<tspan baseline-shift="sub" font-size="8">z</tspan> = 0</text>

  <!-- Coordinate axes and direction labels -->
  <g transform="translate(736 510)">
    <line class="axis-y" x1="0" y1="0" x2="82" y2="0" marker-end="url(#arrowGray)"/>
    <line class="axis-z" x1="0" y1="0" x2="0" y2="-63" marker-end="url(#arrowBlue)"/>
    <text class="small bold" x="88" y="5" fill="#cc79a7">+y</text>
    <text class="small bold" x="8" y="-59" fill="#0077bb">z</text>
    <text class="tiny" x="-3" y="20">leading −y</text>
  </g>

  <text class="tiny" x="842" y="515">MPM section: 0.92 m (y) × 0.12 m (z)</text>
  <text class="tiny" x="842" y="534">Background domain: 1.00 m (y) × 0.28 m (z)</text>
  <text class="tiny" x="718" y="568">Blue: pristine leading layer; orange: recycled trailing slots.</text>
  <text class="tiny" x="718" y="585">Template: 8 layers; recycling axis: global y (direction −y).</text>
  <text class="tiny" x="718" y="602">Vertical scale enlarged for clarity.</text>
</svg>
