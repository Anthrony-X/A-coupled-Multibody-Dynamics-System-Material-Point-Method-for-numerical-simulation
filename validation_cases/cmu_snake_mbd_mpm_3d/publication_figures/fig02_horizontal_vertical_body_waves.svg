<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1120 540">
  <defs>
    <style>
      .panel { font: 700 19px Arial, sans-serif; fill: #202020; }
      .title { font: 700 18px Arial, sans-serif; fill: #202020; }
      .label { font: 14px Arial, sans-serif; fill: #202020; }
      .small { font: 12px Arial, sans-serif; fill: #3f3f3f; }
      .tiny { font: 11px Arial, sans-serif; fill: #555; }
      .equation { font: italic 15px Georgia, 'Times New Roman', serif; fill: #202020; }
      .axis { fill: none; stroke: #555; stroke-width: 1.35; stroke-linecap: round; }
      .zero { fill: none; stroke: #9aa6ac; stroke-width: 1; stroke-dasharray: 5 4; }
      .wave-h { fill: none; stroke: #0077bb; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .wave-v { fill: none; stroke: #cc79a7; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .chain { fill: none; stroke: #4e5a60; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
      .sample-h { fill: #fff; stroke: #0077bb; stroke-width: 1.6; }
      .sample-v { fill: #fff; stroke: #cc79a7; stroke-width: 1.6; }
      .sample-contact { fill: #ee7733; stroke: #8d3f19; stroke-width: 1.3; }
      .dimension { fill: none; stroke: #555; stroke-width: 1.1; stroke-linecap: round; }
      .extension { fill: none; stroke: #8a9aa3; stroke-width: .9; }
      .box { fill: #fff; fill-opacity: .96; stroke: #777; stroke-width: .9; }
      .phase-box { fill: #f7fbfd; stroke: #457487; stroke-width: 1; }
      .contact-band { fill: #f5c6a5; fill-opacity: .72; stroke: #8d3f19; stroke-width: 1; stroke-dasharray: 3 2; }
      .guide { fill: none; stroke: #555; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0077bb"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc79a7"/>
    </marker>
  </defs>

  <rect width="1120" height="540" fill="#fff"/>

  <!-- Panel a: horizontal wave -->
  <text class="panel" x="16" y="28">(a)</text>
  <text class="title" x="54" y="28">Horizontal body wave — top view</text>

  <rect class="box" x="76" y="48" width="392" height="38" rx="2"/>
  <text class="equation" x="95" y="72">y<tspan baseline-shift="sub" font-size="11">h</tspan>(s,t) = a<tspan baseline-shift="sub" font-size="11">h</tspan> sin(2πs/λ − 2πft)</text>

  <!-- Coordinate axes -->
  <line class="axis" x1="80" y1="335" x2="80" y2="137" marker-end="url(#arrowDark)"/>
  <line class="axis" x1="66" y1="245" x2="544" y2="245" marker-end="url(#arrowDark)"/>
  <text class="label" x="53" y="145">y<tspan baseline-shift="sub" font-size="10">h</tspan></text>
  <text class="label" x="535" y="235">s</text>
  <line class="zero" x1="80" y1="245" x2="520" y2="245"/>

  <!-- Continuous horizontal backbone -->
  <path class="wave-h" d="M80,245 C116.7,158.3 153.3,158.3 190,245 C226.7,331.7 263.3,331.7 300,245 C336.7,158.3 373.3,158.3 410,245 C446.7,331.7 483.3,331.7 520,245"/>

  <!-- Discrete 17-module samples -->
  <polyline class="chain" points="92.9,221.5 118.8,186.8 144.7,182.5 170.6,210.8 196.5,256.9 222.4,296.9 248.2,309.7 274.1,288.8 300,245 325.9,201.2 351.8,180.3 377.6,193.1 403.5,233.1 429.4,279.2 455.3,307.5 481.2,303.2 507.1,268.5"/>
  <g>
    <circle class="sample-h" cx="92.9" cy="221.5" r="4.2"/><circle class="sample-h" cx="118.8" cy="186.8" r="4.2"/>
    <circle class="sample-h" cx="144.7" cy="182.5" r="4.2"/><circle class="sample-h" cx="170.6" cy="210.8" r="4.2"/>
    <circle class="sample-h" cx="196.5" cy="256.9" r="4.2"/><circle class="sample-h" cx="222.4" cy="296.9" r="4.2"/>
    <circle class="sample-h" cx="248.2" cy="309.7" r="4.2"/><circle class="sample-h" cx="274.1" cy="288.8" r="4.2"/>
    <circle class="sample-h" cx="300" cy="245" r="4.2"/><circle class="sample-h" cx="325.9" cy="201.2" r="4.2"/>
    <circle class="sample-h" cx="351.8" cy="180.3" r="4.2"/><circle class="sample-h" cx="377.6" cy="193.1" r="4.2"/>
    <circle class="sample-h" cx="403.5" cy="233.1" r="4.2"/><circle class="sample-h" cx="429.4" cy="279.2" r="4.2"/>
    <circle class="sample-h" cx="455.3" cy="307.5" r="4.2"/><circle class="sample-h" cx="481.2" cy="303.2" r="4.2"/>
    <circle class="sample-h" cx="507.1" cy="268.5" r="4.2"/>
  </g>

  <!-- Horizontal-wave dimensions -->
  <line class="dimension" x1="61" y1="245" x2="61" y2="180" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <text class="small" x="19" y="209">a<tspan baseline-shift="sub" font-size="9">h</tspan> = 0.035 m</text>

  <line class="extension" x1="80" y1="330" x2="80" y2="366"/>
  <line class="extension" x1="300" y1="330" x2="300" y2="366"/>
  <line class="dimension" x1="80" y1="350" x2="300" y2="350" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <rect x="148" y="339" width="84" height="18" fill="#fff"/>
  <text class="small" x="157" y="352">λ = 0.47 m</text>

  <line class="extension" x1="80" y1="362" x2="80" y2="405"/>
  <line class="extension" x1="520" y1="330" x2="520" y2="405"/>
  <line class="dimension" x1="80" y1="389" x2="520" y2="389" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <rect x="254" y="378" width="92" height="18" fill="#fff"/>
  <text class="small" x="267" y="391">L = 0.94 m</text>

  <line x1="337" y1="111" x2="425" y2="111" stroke="#0077bb" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text class="small" x="338" y="104">wave propagation</text>

  <polyline class="guide" points="351.8,180.3 413,127 492,127"/>
  <text class="small" x="416" y="123">continuous backbone</text>
  <polyline class="guide" points="429.4,279.2 477,310 525,310"/>
  <text class="small" x="431" y="327">17 module-center samples</text>

  <!-- Panel separator -->
  <line x1="560" y1="12" x2="560" y2="526" stroke="#c8c8c8" stroke-width="1"/>

  <!-- Panel b: vertical wave -->
  <text class="panel" x="578" y="28">(b)</text>
  <text class="title" x="616" y="28">Vertical body wave — side view</text>

  <rect class="box" x="646" y="48" width="428" height="38" rx="2"/>
  <text class="equation" x="662" y="72">z<tspan baseline-shift="sub" font-size="11">v</tspan>(s,t) = a<tspan baseline-shift="sub" font-size="11">v</tspan> sin(2πs/λ − 2πft + φ)</text>

  <!-- Coordinate axes -->
  <line class="axis" x1="650" y1="335" x2="650" y2="137" marker-end="url(#arrowDark)"/>
  <line class="axis" x1="636" y1="245" x2="1101" y2="245" marker-end="url(#arrowDark)"/>
  <text class="label" x="623" y="145">z<tspan baseline-shift="sub" font-size="10">v</tspan></text>
  <text class="label" x="1091" y="235">s</text>
  <line class="zero" x1="650" y1="245" x2="1090" y2="245"/>

  <!-- Low-elevation contact intervals -->
  <ellipse class="contact-band" cx="760" cy="309" rx="43" ry="9"/>
  <ellipse class="contact-band" cx="980" cy="309" rx="43" ry="9"/>

  <!-- Continuous vertical backbone, shifted by pi/2 -->
  <path class="wave-v" d="M650,197 C650,197 684,206 705,245 C726,284 739,293 760,293 C781,293 794,284 815,245 C836,206 849,197 870,197 C891,197 904,206 925,245 C946,284 959,293 980,293 C1001,293 1014,284 1035,245 C1056,206 1069,197 1090,197"/>

  <!-- Discrete 17-module samples -->
  <polyline class="chain" points="662.9,200.2 688.8,223.6 714.7,258.1 740.6,285.8 766.5,292.2 792.4,273.9 818.2,240.6 844.1,209.5 870,197 895.9,209.5 921.8,240.6 947.6,273.9 973.5,292.2 999.4,285.8 1025.3,258.1 1051.2,223.6 1077.1,200.2"/>
  <g>
    <circle class="sample-v" cx="662.9" cy="200.2" r="4.2"/><circle class="sample-v" cx="688.8" cy="223.6" r="4.2"/>
    <circle class="sample-v" cx="714.7" cy="258.1" r="4.2"/><circle class="sample-v" cx="740.6" cy="285.8" r="4.2"/>
    <circle class="sample-contact" cx="766.5" cy="292.2" r="4.5"/><circle class="sample-v" cx="792.4" cy="273.9" r="4.2"/>
    <circle class="sample-v" cx="818.2" cy="240.6" r="4.2"/><circle class="sample-v" cx="844.1" cy="209.5" r="4.2"/>
    <circle class="sample-v" cx="870" cy="197" r="4.2"/><circle class="sample-v" cx="895.9" cy="209.5" r="4.2"/>
    <circle class="sample-v" cx="921.8" cy="240.6" r="4.2"/><circle class="sample-v" cx="947.6" cy="273.9" r="4.2"/>
    <circle class="sample-contact" cx="973.5" cy="292.2" r="4.5"/><circle class="sample-v" cx="999.4" cy="285.8" r="4.2"/>
    <circle class="sample-v" cx="1025.3" cy="258.1" r="4.2"/><circle class="sample-v" cx="1051.2" cy="223.6" r="4.2"/>
    <circle class="sample-v" cx="1077.1" cy="200.2" r="4.2"/>
  </g>

  <!-- Vertical-wave dimensions -->
  <line class="dimension" x1="629" y1="245" x2="629" y2="197" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <text class="small" x="575" y="215">a<tspan baseline-shift="sub" font-size="9">v</tspan> = 0.016 m</text>

  <line class="extension" x1="650" y1="330" x2="650" y2="366"/>
  <line class="extension" x1="870" y1="315" x2="870" y2="366"/>
  <line class="dimension" x1="650" y1="350" x2="870" y2="350" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <rect x="718" y="339" width="84" height="18" fill="#fff"/>
  <text class="small" x="727" y="352">λ = 0.47 m</text>

  <line class="extension" x1="650" y1="362" x2="650" y2="405"/>
  <line class="extension" x1="1090" y1="315" x2="1090" y2="405"/>
  <line class="dimension" x1="650" y1="389" x2="1090" y2="389" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"/>
  <rect x="824" y="378" width="92" height="18" fill="#fff"/>
  <text class="small" x="837" y="391">L = 0.94 m</text>

  <polyline class="guide" points="973.5,292.2 1017,324 1090,324"/>
  <text class="small" x="926" y="341">low-elevation/contact interval</text>

  <!-- Shared phase relation and legend -->
  <rect class="phase-box" x="356" y="430" width="408" height="55" rx="3"/>
  <line x1="382" y1="448" x2="430" y2="448" stroke="#0077bb" stroke-width="3"/>
  <text class="small" x="440" y="452">horizontal wave</text>
  <line x1="562" y1="448" x2="610" y2="448" stroke="#cc79a7" stroke-width="3"/>
  <text class="small" x="620" y="452">vertical wave</text>
  <text class="label" x="406" y="475">Orthogonal-wave phase offset:  φ = π/2</text>

  <circle class="sample-h" cx="827" cy="449" r="4.2"/>
  <text class="small" x="839" y="453">discrete module center</text>
  <circle class="sample-contact" cx="988" cy="449" r="4.5"/>
  <text class="small" x="1000" y="453">contact sample</text>

  <text class="tiny" x="50" y="518">The continuous backbone is sampled at 17 module centers and fitted sequentially to the 16 alternating yaw/pitch joint axes.</text>
</svg>
